# Native E2E (Maestro) — Android emulator gate.
name: Native E2E (Maestro)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maestro:
    runs-on: ubuntu-latest
    # Non-blocking for now: the Android emulator/Maestro-driver setup is flaky on
    # the standard GitHub runner (slow boots, driver-startup timeouts) and fails
    # independently of the app code. Keep the job running for signal, but don't let
    # it gate merges. Revert to a required check once it runs on a beefier runner.
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Build and run native smoke suite
        uses: reactivecircus/android-emulator-runner@v2
        env:
          EXPO_PUBLIC_DEMO_MODE: '1'
          EXPO_PUBLIC_COACH_RELEASE_CHANNEL: 'internal'
          # The Maestro instrumentation driver can be slow to come up on a loaded
          # CI runner (emulator boot alone takes ~6 min here); the 15s default
          # times out. Give it room.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '120000'
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          # Headless, software-GPU emulator flags for CI stability (avoids the
          # broken-pipe/driver-startup flakiness of the windowed default).
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            npx expo prebuild --platform android --clean --non-interactive
            # Expo's default Gradle heap (~2g) OOMs the D8 dex merger on this app
            # (Task :app:mergeExtDexDebug -> java.lang.OutOfMemoryError). Raise it;
            # the ubuntu-latest runner has 16g, so 6g is safe.
            printf '\norg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\n' >> android/gradle.properties
            cd android && ./gradlew assembleDebug --no-daemon && cd ..
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            $HOME/.maestro/bin/maestro test .maestro --include-tags smoke --format junit --output maestro-report.xml
      - name: Upload native report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report
          path: maestro-report.xml
          if-no-files-found: warn
