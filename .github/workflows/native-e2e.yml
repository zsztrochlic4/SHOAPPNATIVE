# Native E2E (Maestro) — MANUAL ONLY (workflow_dispatch).
#
# This deliberately does NOT run on push/PR: native flows need a built app on a
# real device / emulator (or Maestro Cloud), which isn't provisioned yet. It's a
# scaffold — fill in the build + device steps when the device lab / runners exist,
# then add it to the `main` ruleset's required checks. See .maestro/README.md.
name: Native E2E (Maestro)

on:
  workflow_dispatch:

jobs:
  maestro:
    # A device lab is required. Options:
    #  - macOS runner + iOS Simulator (`macos-14`), or Android emulator
    #    (reactivecircus/android-emulator-runner), or
    #  - Maestro Cloud (upload the built .app/.apk).
    runs-on: ubuntu-latest
    if: ${{ false }}   # remove this guard once the device/build steps below are real
    steps:
      - uses: actions/checkout@v4

      # 1) Build (or download) the app artifact for the target platform.
      #    e.g. `eas build --profile development --platform android --local` with
      #    EXPO_PUBLIC_DEMO_MODE=1, or pull a prebuilt artifact.

      # 2) Boot an emulator/simulator and install the artifact.

      # 3) Install Maestro and run the suite:
      #    - run: curl -fsSL "https://get.maestro.mobile.dev" | bash
      #    - run: $HOME/.maestro/bin/maestro test .maestro --format junit --output maestro-report.xml

      # 4) Upload the report:
      #    - uses: actions/upload-artifact@v4
      #      with: { name: maestro-report, path: maestro-report.xml }
      - run: echo "Provision a device lab, then implement steps 1-4. See .maestro/README.md"
