name: Deploy web preview

# Builds the Expo web export and publishes it to GitHub Pages so the app can be
# previewed in any browser at https://<owner>.github.io/sho-app-native/.
# One-time setup: repo Settings → Pages → Build and deployment → Source:
# "GitHub Actions". After that this runs automatically on every push.

on:
  push:
    branches:
      - claude/zen-wozniak-ggne93
      - claude/github-app-install-jxuxcx
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Required release checks
        run: npm run validate:coach-release && npm run lint && npm run typecheck && npm run check && npm run sweep && npm run test:safety && npm run test:unit && npm run test:rules && npm run test:e2e && npm --prefix functions ci && npm --prefix functions test
      - name: Export web build
        env:
          # GitHub Pages serves this project under the /sho-app-native/ sub-path.
          EXPO_WEB_BASE_URL: /SHOAPPNATIVE
          # App Check (audit C-016): the reCAPTCHA Enterprise site key is public (it ships in the
          # client bundle), so it lives in a repo Variable, not a secret. When set, initAppCheck()
          # attaches an attestation token to Firebase calls; absent, the client stays a safe no-op.
          EXPO_PUBLIC_APPCHECK_RECAPTCHA_ENTERPRISE_KEY: ${{ vars.APPCHECK_RECAPTCHA_ENTERPRISE_KEY }}
          EXPO_PUBLIC_APPCHECK_WEB_ENABLED: ${{ vars.APPCHECK_WEB_ENABLED }}
        run: npx expo export --platform web
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
