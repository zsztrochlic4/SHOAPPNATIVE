appId: com.zaggy887.strengthhub
tags:
  - permission
  - nutrition
---
# JOURNEY: permission. Opening the meal scanner triggers the OS camera/photos
# permission dialog on first use; the app must handle grant AND deny gracefully.
- runFlow: ../subflows/boot.yaml
- tapOn: "Nutrition"
- assertVisible: "Snap your meal"
- tapOn: "Snap your meal"

# The system permission dialog is native chrome, not the app. Accept it if it appears.
# Button text differs by OS/locale ("Allow", "While using the app", "OK") — extend as needed.
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"

# TODO (on device): assert the capture UI that appears after "Snap your meal"
# (confirm its exact label on a real build, e.g. a "Take a photo" / camera control),
# then exercise the DENY path in a second run and assert a graceful fallback + retry.
# For now, assert the app stayed alive and we can return to the tab.
- assertVisible: "Nutrition"
