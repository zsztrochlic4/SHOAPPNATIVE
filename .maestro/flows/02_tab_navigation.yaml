appId: com.zaggy887.strengthhub
tags:
  - smoke
  - core
---
# JOURNEY: navigation. Switching tabs shows a control unique to each screen
# (mirrors e2e/smoke.spec.ts). The app mounts a tab's screen only on first visit
# (visitedTabs) and keeps tabs mounted via <Activity>, so after each tap we
# extendedWaitUntil the new screen's signature control renders — a bare assertVisible
# can race the first mount.
- runFlow: ../subflows/boot.yaml

- tapOn: "Nutrition"
- extendedWaitUntil:
    visible: "food log"
    timeout: 20000

- tapOn: "Coach"
- extendedWaitUntil:
    visible: "Meet your coach"
    timeout: 20000
- tapOn: "Continue with coach"
- extendedWaitUntil:
    visible: "Message your coach"
    timeout: 20000

- tapOn: "Workout"
- extendedWaitUntil:
    visible: "History"        # Workout's inner segmented tab
    timeout: 20000

- tapOn: "Community"
- extendedWaitUntil:
    visible: "League"         # Community's inner segmented tab
    timeout: 20000

- tapOn: "Nutrition"
- extendedWaitUntil:
    visible: "food log"
    timeout: 20000

- tapOn: "Dashboard"
- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 20000
